name: CCIMA Build Images

on:
  push:
    branches: [deploy/plane-v1.4.3]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ccima-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/deploy/plane-v1.4.3'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            context: .
            dockerfile: apps/web/Dockerfile.web
          - image: admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - image: space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - image: backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - image: live
            context: .
            dockerfile: apps/live/Dockerfile.live
          - image: proxy
            context: apps/proxy
            dockerfile: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/antoniorenovato/plane-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VITE_API_BASE_URL=
            VITE_API_BASE_PATH=/api
            VITE_ADMIN_BASE_URL=
            VITE_ADMIN_BASE_PATH=/god-mode
            VITE_SPACE_BASE_URL=
            VITE_SPACE_BASE_PATH=/spaces
            VITE_LIVE_BASE_URL=
            VITE_LIVE_BASE_PATH=/live
            VITE_WEB_BASE_URL=
            VITE_WEB_BASE_PATH=
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
